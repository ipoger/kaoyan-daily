name: Bug 报告
description: 页面、排期、判分或数据出现问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器与系统
      placeholder: Safari 18 / iOS 18；Chrome 130 / macOS
  - type: textarea
    id: state
    attributes:
      label: 进度备份（可选）
      description: 设置页可以导出 JSON。请先确认里面没有你不想公开的信息。
